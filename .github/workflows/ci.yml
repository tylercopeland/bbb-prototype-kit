name: CI

on: push

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # The unit tests share one jsdom (isolate: false); a shuffled order proves
      # that src/test/setup.ts resets everything a test can leave behind.
      - run: npx vitest run --reporter=dot --sequence.shuffle --sequence.seed=${{ github.run_number }}
      # The GitHub Pages build lives under /bbb-prototype-kit/ (deploy.yml); every
      # other build is at /. Prove the base-path build serves its page, a deep
      # link and every script, stylesheet and font it references.
      - name: Smoke-test the build under the Pages path
        env:
          BASE_PATH: /bbb-prototype-kit/
        run: |
          npx vite build --logLevel warn
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8.0.3 -t 30000 http://localhost:4173/bbb-prototype-kit/
          base=http://localhost:4173/bbb-prototype-kit
          curl -fsS "$base/" | grep -q '/bbb-prototype-kit/assets/'
          curl -fsS "$base/desktop/F1Bar-4roh-l8ju" | grep -q '<div id="root">'
          for asset in $(grep -oE '/bbb-prototype-kit/assets/[^"]+' dist/index.html) \
                       $(grep -ohE 'url\(/bbb-prototype-kit/assets/[^)]+' dist/assets/*.css | sed 's/^url(//'); do
            curl -fsS -o /dev/null "http://localhost:4173$asset" || { echo "missing $asset"; exit 1; }
          done
          ! grep -lE '(src|href)="/assets/|url\(/assets/' dist/index.html dist/assets/*.css

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system packages
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system packages
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Runs every spec in e2e/, including visual.spec.ts, which compares the
      # desktop routes with the baselines in e2e/visual.spec.ts-snapshots once
      # the update-snapshots workflow has committed them (it skips until then).
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
