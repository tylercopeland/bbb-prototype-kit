# Publishes the prototype to GitHub Pages, with Storybook alongside it:
#   https://tylercopeland.github.io/bbb-prototype-kit/            the app
#   https://tylercopeland.github.io/bbb-prototype-kit/storybook/  Storybook
# It runs after CI succeeds on main, so only a green commit is published, and
# by hand (Actions › Deploy to GitHub Pages › Run workflow). Pages must use
# "GitHub Actions" as its source (Settings › Pages), set once by the owner.
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI just passed, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the app under the Pages path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STORYBOOK_PATH: /storybook/
      # Pages serves 404.html for any unknown path, so a deep link such as
      # /desktop/F1Bar-4roh-l8ju loads the app, whose router then shows it.
      - run: cp dist/index.html dist/404.html
      - run: npx storybook build --quiet --output-dir dist/storybook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
