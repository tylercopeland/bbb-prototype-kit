# Regenerates the screenshot baselines of e2e/visual.spec.ts on CI's Chromium
# and commits them to the chosen branch. Run it by hand (Actions → Update
# screenshot baselines → Run workflow) after a change that is meant to alter
# how a desktop route looks; the normal CI then compares every push against
# the new PNGs. Baselines are never generated locally: a local Chromium
# renders text and shadows differently from the one CI installs.
name: Update screenshot baselines

#
# A push whose commit message contains [update-snapshots] runs it too, on the
# pushed branch: GitHub only offers Run workflow once this file is on the
# default branch, so a new branch seeds its baselines this way. The workflow's
# own commit is pushed with GITHUB_TOKEN, which never triggers workflows.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose baselines are regenerated and committed
        required: true
        default: main
  push:

permissions:
  contents: write

concurrency:
  group: update-snapshots-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: true

env:
  BRANCH: ${{ inputs.branch || github.ref_name }}

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-snapshots]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system packages
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system packages
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # playwright.config.ts serves the built app and the static Storybook.
      - run: npm run build
      - run: npx storybook build --quiet
      - name: Regenerate the baselines
        # The spec skips itself while no baselines exist; VISUAL_UPDATE lets
        # the first run seed the folder, and --update-snapshots rewrites them.
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
        env:
          VISUAL_UPDATE: '1'
      - name: Commit the baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines are unchanged."
            exit 0
          fi
          git commit -m "Regenerate the screenshot baselines in CI" -m "Generated by the update-snapshots workflow on CI's Chromium (run ${{ github.run_id }})."
          git push origin "HEAD:$BRANCH"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-baselines
          path: e2e/visual.spec.ts-snapshots
          retention-days: 7
